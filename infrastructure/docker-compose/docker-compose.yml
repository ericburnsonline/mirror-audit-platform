services:
  postgres:
    image: postgres:15
    container_name: map_postgres
    environment:
      POSTGRES_USER: map_user
      POSTGRES_PASSWORD: map_password
      POSTGRES_DB: mirror_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: map_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: